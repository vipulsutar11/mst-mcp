name: mst-mcp
displayName: MST-MCP
description: An MCP server designed for the MST Chain ecosystem that provides search and retrieval tools for documentation.
version: 1.0.0
author: vipulsutar11

startCommand:
  type: stdio
  commandFunction: |-
    (config) => ({
      command: 'python',
      args: ['server.py']
    })

configSchema:
  type: object
  properties: {}
  required: []

installation:
  type: pip
  package: .
  requirements:
    - mcp==2.0.0
